<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>乒乓球员收集计划 · Pong Table Tennis</title>
<style>
  :root {
    --bg: #0a1015;
    --panel: #101820;
    --gold: #f4c95d;
    --cyan: #59d8c3;
    --muted: #8fa3aa;
    --line: #24343d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: #eef3f2;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background:
      radial-gradient(900px 480px at 50% -10%, #16252c 0%, rgba(10, 16, 21, 0) 70%),
      var(--bg);
  }
  #stage {
    position: relative;
    width: min(1000px, 100%);
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 28px 70px -30px rgba(0, 0, 0, .95);
    outline: none;
  }
  #stage:focus,
  #stage:focus-visible { outline: none; }
  #screen {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1000 / 620;
    background: var(--panel);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background:
      radial-gradient(700px 420px at 50% 20%, rgba(89, 216, 195, .10), transparent 70%),
      linear-gradient(180deg, #0e171d 0%, #0a1116 100%);
    transition: opacity .4s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .panel { max-width: 560px; }
  .kicker {
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 11px;
    letter-spacing: .28em;
    color: var(--cyan);
    text-transform: uppercase;
  }
  h1 {
    margin: 14px 0 6px;
    font-size: clamp(22px, 4.2vw, 34px);
    letter-spacing: .06em;
    color: #fff;
  }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  #status {
    min-height: 20px;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: var(--gold);
    font-family: Consolas, "Cascadia Mono", monospace;
  }
  #start {
    appearance: none;
    border: 1px solid #6b5a2a;
    background: linear-gradient(180deg, #f4c95d, #d9a93d);
    color: #17200f;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .12em;
    padding: 12px 40px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow: 0 10px 24px -12px rgba(244, 201, 93, .8);
  }
  #start:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
  #start:active:not(:disabled) { transform: translateY(1px); }
  #start:disabled {
    background: #253038;
    border-color: #35444d;
    color: #6f8089;
    cursor: progress;
    box-shadow: none;
  }
  .keys {
    margin-top: 22px;
    font-size: 11.5px;
    line-height: 1.9;
    color: #7d929a;
  }
  .keys b { color: #cfdde1; font-weight: 600; }
  .note { margin-top: 10px; font-size: 11px; color: #55707a; }

  #error {
    position: absolute;
    inset: auto 16px 16px;
    z-index: 9;
    background: #2a1416;
    border: 1px solid #7a3438;
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
    font-size: 12px;
    color: #ffc9c9;
  }
  #error strong { display: block; margin-bottom: 4px; color: #ff9d9d; }
  #error .detail { font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; }

  #stage:fullscreen {
    width: 100vw;
    height: 100vh;
    border: 0;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05090c;
  }
  #stage:fullscreen #screen {
    width: auto;
    height: 100%;
    max-width: 100%;
    aspect-ratio: 1000 / 620;
  }
  /* Embedded in an iframe: fill the frame edge to edge. */
  html.embedded body { padding: 0; overflow: hidden; }
  html.embedded #stage { width: 100%; border: 0; border-radius: 0; }
  html.embedded #screen { border-radius: 0; }
  @media (max-width: 560px) {
    body { padding: 0; }
    #stage { border-radius: 0; border: 0; }
    .keys { display: none; }
  }
</style>
</head>
<body>
  <div id="stage" tabindex="0">
    <canvas id="screen" width="1000" height="620" aria-label="乒乓球员收集计划"></canvas>

    <div id="overlay">
      <div class="panel">
        <div class="kicker">Python · Tkinter · Pyodide</div>
        <h1>乒乓球员收集计划</h1>
        <p class="sub">PONG TABLE TENNIS — 在浏览器里跑真正的 Python</p>
        <div id="status">正在加载 Python 运行时…</div>
        <div>
          <button id="start" type="button" disabled>加载中…</button>
        </div>
        <div class="keys">
          <b>W A S D / 方向键</b> 移动 · <b>Shift</b> 冲刺 · <b>J</b> 扣杀 · <b>C</b> 削球 · <b>K</b> 反击<br>
          <b>E</b> 技能 · <b>1 / 2 / 3</b> 选择发球旋转 · <b>空格</b> 发球 / 开始 · <b>P</b> 暂停 · <b>M</b> 静音<br>
          <b>F</b> 或双击画面切换全屏
        </div>
        <div class="note">首次加载约 10 MB，需要联网；进度保存在浏览器本地。</div>
      </div>
    </div>

    <div id="error" hidden>
      <strong>启动失败</strong>
      <div class="detail"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
